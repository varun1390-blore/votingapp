<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Quote Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <section class="quote-card" role="region" aria-label="Daily quote">
        <div id="quoteText" class="quote-text" aria-live="polite"></div>
        <div id="quoteAuthor" class="quote-author"></div>

        <button id="newQuoteBtn" class="button" type="button" aria-label="Show a new random quote">Show New Quote</button>
        <div class="meta">
          <span id="dailyBadge" class="badge" aria-hidden="true">Today's quote</span>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
